<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Home 3D model</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #e9e6e1; font-family: -apple-system, system-ui, sans-serif; }
  #ui { position: fixed; top: 12px; left: 12px; display: flex; flex-wrap: wrap; gap: 6px; max-width: 70vw; z-index: 2; }
  #ui button { border: 0; border-radius: 6px; padding: 7px 11px; background: #fff; box-shadow: 0 1px 3px #0002; cursor: pointer; font-size: 13px; }
  #ui button.on { background: #2b2b2b; color: #fff; }
  #ui .sep { width: 100%; height: 0; }
  #help { position: fixed; bottom: 12px; left: 12px; font-size: 12px; color: #555; background: #fffc; padding: 6px 9px; border-radius: 6px; z-index: 2; }
  .label { font-size: 12px; font-weight: 600; letter-spacing: .04em; color: #333; background: #fffd; padding: 2px 6px; border-radius: 4px; white-space: nowrap; pointer-events: none; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script src="model.js"></script>
</head>
<body>
<div id="ui">
  <button data-view="dollhouse" class="on">Dollhouse</button>
  <button data-view="top">Top</button>
  <button data-view="walk">Walk</button>
  <button id="cut" class="on">Walls: cut away</button>
  <button id="ceil">Ceiling: off</button>
  <div class="sep"></div>
</div>
<div id="help">Drag to orbit · scroll to zoom · right-drag to pan</div>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { PointerLockControls } from "three/addons/controls/PointerLockControls.js";
import { CSS2DRenderer, CSS2DObject } from "three/addons/renderers/CSS2DRenderer.js";

const M = window.MODEL;
const EYE = 1.6;
const [W, D] = M.bounds;
const centre = new THREE.Vector3(W / 2, 0, -D / 2);

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(devicePixelRatio);
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.localClippingEnabled = true;
document.body.appendChild(renderer.domElement);
const labels = new CSS2DRenderer();
labels.setSize(innerWidth, innerHeight);
Object.assign(labels.domElement.style, { position: "fixed", top: 0, pointerEvents: "none" });
document.body.appendChild(labels.domElement);

const scene = new THREE.Scene();
const ray = new THREE.Raycaster();
scene.background = new THREE.Color(0xe9e6e1);
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.05, 500);

scene.add(new THREE.HemisphereLight(0xffffff, 0xcfc4b0, 2.0));
const sun = new THREE.DirectionalLight(0xfff4e5, 1.1);
sun.position.set(centre.x - 4, 30, centre.z + 6);
sun.target.position.copy(centre);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
Object.assign(sun.shadow.camera, { left: -18, right: 18, top: 18, bottom: -18, near: 1, far: 60 });
scene.add(sun, sun.target);

// Plan (x, y) metres -> world (x, -y) on the ground; shapes are extruded upwards from `base`.
function shape(ring, holes = []) {
  const s = new THREE.Shape(ring.map(([x, y]) => new THREE.Vector2(x, y)));
  s.holes = holes.map(h => new THREE.Path(h.map(([x, y]) => new THREE.Vector2(x, y))));
  return s;
}
function prism(ring, holes, base, top, material, shadows = true) {
  const g = new THREE.ExtrudeGeometry(shape(ring, holes), { depth: top - base, bevelEnabled: false });
  g.rotateX(-Math.PI / 2);
  const m = new THREE.Mesh(g, material);
  m.position.y = base;
  m.castShadow = m.receiveShadow = shadows;
  scene.add(m);
  return m;
}

// Dollhouse cut: everything above CUT is clipped away so rooms can be seen into.
const CUT = 1.3;
const cutPlane = new THREE.Plane(new THREE.Vector3(0, -1, 0), CUT);
const mat = {
  wall: new THREE.MeshStandardMaterial({ color: 0xf4f1ec, roughness: 0.9, side: THREE.DoubleSide, clippingPlanes: [cutPlane] }),
  floor: {
    dry: new THREE.MeshStandardMaterial({ color: 0xc9a77c, roughness: 0.75 }),
    wet: new THREE.MeshStandardMaterial({ color: 0xd9d6d0, roughness: 0.5 }),
    outdoor: new THREE.MeshStandardMaterial({ color: 0xa9a299, roughness: 0.95 }),
  },
  ceiling: new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0x5a5852, roughness: 1, side: THREE.DoubleSide }),
  glass: new THREE.MeshPhysicalMaterial({ color: 0xbfd9e6, transparent: true, opacity: 0.25, roughness: 0.05, clippingPlanes: [cutPlane] }),
  frame: new THREE.MeshStandardMaterial({ color: 0x3a3a3a, roughness: 0.6 }),
};

const walls = M.walls.map(w => prism(w.outer, w.holes, 0, w.height, mat.wall));
M.floor.forEach(f => {
  const g = new THREE.ShapeGeometry(shape(f.outer, f.holes));
  g.rotateX(-Math.PI / 2);
  const m = new THREE.Mesh(g, mat.floor[f.kind] || mat.floor.dry);
  m.receiveShadow = true;
  scene.add(m);
});
const ceilings = M.floor.filter(f => f.kind !== "outdoor").map(f => {
  const g = new THREE.ShapeGeometry(shape(f.outer, f.holes));
  g.rotateX(-Math.PI / 2);
  const m = new THREE.Mesh(g, mat.ceiling);
  m.position.y = M.ceiling;
  m.visible = false;
  scene.add(m);
  return m;
});
for (const o of M.openings) {
  if (o.kind === "door") {
    walls.push(prism(o.outer, [], M.doorHead, M.ceiling, mat.wall));
  } else {
    const sill = o.sill ?? M.sill, head = o.head ?? M.winHead;  // per-window heights (build_geometry.py --window)
    walls.push(prism(o.outer, [], 0, sill, mat.wall));
    walls.push(prism(o.outer, [], head, M.ceiling, mat.wall));
    prism(o.outer, [], sill, head, mat.glass, false);
  }
}

// Room labels + jump buttons.
const ui = document.getElementById("ui");
for (const l of M.labels) {
  const div = document.createElement("div");
  div.className = "label";
  div.textContent = l.text;
  const obj = new CSS2DObject(div);
  obj.position.set(l.x, 0.05, -l.y);
  scene.add(obj);
  const b = document.createElement("button");
  b.textContent = l.text.charAt(0) + l.text.slice(1).toLowerCase();
  b.onclick = () => walkAt(l.x + 0.4, -l.y);
  ui.appendChild(b);
}

// Walking always has a ceiling; the button controls it for the dollhouse and top views.
let ceilingWanted = false;
function showCeiling(on) {
  ceilings.forEach(c => c.visible = on);
}

// Views.
const orbit = new OrbitControls(camera, renderer.domElement);
orbit.enableDamping = true;
const walk = new PointerLockControls(camera, document.body);
const help = document.getElementById("help");
let mode = "dollhouse";
function setMode(m) {
  mode = m;
  document.querySelectorAll("[data-view]").forEach(b => b.classList.toggle("on", b.dataset.view === m));
  orbit.enabled = m !== "walk";
  camera.fov = m === "top" ? 30 : m === "walk" ? 70 : 50;
  camera.updateProjectionMatrix();
  setCut(m !== "walk" && document.getElementById("cut").classList.contains("on"));
  labels.domElement.style.display = m === "walk" ? "none" : "";
  showCeiling(m === "walk" || ceilingWanted);
  if (m === "dollhouse") {
    camera.position.set(centre.x - 6, 16, centre.z + 14);
    orbit.target.copy(centre);
    help.textContent = "Drag to orbit · scroll to zoom · right-drag to pan";
  } else if (m === "top") {
    camera.position.set(centre.x, 46, centre.z + 0.01);
    orbit.target.copy(centre);
    help.textContent = "Drag to rotate · scroll to zoom · right-drag to pan";
  } else {
    help.textContent = "Click to look around · WASD / arrows to move · Esc to release mouse";
  }
  camera.up.set(0, 1, 0);
  orbit.update();
}
// Stand against the wall opposite the room's longest open direction, looking across the room.
function walkAt(x, z) {
  setMode("walk");
  const from = new THREE.Vector3(x, 1.2, z);
  const reach = a => {
    ray.set(from, new THREE.Vector3(Math.cos(a), 0, Math.sin(a)));
    ray.far = 30;
    return ray.intersectObjects(walls)[0]?.distance ?? 30;
  };
  const angles = [...Array(8)].map((_, i) => (i * Math.PI) / 4);
  const best = angles.reduce((a, b) => (reach(b) > reach(a) ? b : a));
  const back = Math.max(0, reach(best + Math.PI) - 0.35);
  camera.position.set(x - Math.cos(best) * back, EYE, z - Math.sin(best) * back);
  camera.lookAt(camera.position.x + Math.cos(best), EYE, camera.position.z + Math.sin(best));
}
document.querySelectorAll("[data-view]").forEach(b => b.onclick = () =>
  b.dataset.view === "walk" ? walkAt(centre.x, centre.z) : setMode(b.dataset.view));
function setCut(on) {
  cutPlane.constant = on ? CUT : 1000;
}
document.getElementById("cut").onclick = e => {
  const on = !e.target.classList.contains("on");
  e.target.classList.toggle("on", on);
  e.target.textContent = `Walls: ${on ? "cut away" : "full height"}`;
  setCut(on && mode !== "walk");
};
document.getElementById("ceil").onclick = e => {
  ceilingWanted = !ceilingWanted;
  e.target.textContent = `Ceiling: ${ceilingWanted ? "on" : "off"}`;
  showCeiling(mode === "walk" || ceilingWanted);
};
renderer.domElement.addEventListener("click", () => mode === "walk" && walk.lock());

// Walking with simple wall collision.
const keys = {};
addEventListener("keydown", e => keys[e.code] = true);
addEventListener("keyup", e => keys[e.code] = false);
function step(dt) {
  const fwd = (keys.KeyW || keys.ArrowUp ? 1 : 0) - (keys.KeyS || keys.ArrowDown ? 1 : 0);
  const side = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0);
  if (!fwd && !side) return;
  const dir = new THREE.Vector3();
  camera.getWorldDirection(dir);
  dir.y = 0;
  dir.normalize();
  const right = new THREE.Vector3().crossVectors(dir, camera.up);
  const move = dir.multiplyScalar(fwd).add(right.multiplyScalar(side)).normalize();
  for (const h of [0.3, 1.2]) {
    ray.set(new THREE.Vector3(camera.position.x, h, camera.position.z), move);
    ray.far = 0.35;
    if (ray.intersectObjects(walls).length) return;
  }
  camera.position.addScaledVector(move, 1.6 * dt);
}

const params = new URLSearchParams(location.search);
const room = params.get("room");
const hit = room && M.labels.find(l => l.text.toLowerCase().startsWith(room.toLowerCase()));
if (hit) {
  walkAt(hit.x + 0.4, -hit.y);
} else {
  setMode(params.get("view") || "dollhouse");
}

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  if (mode === "walk") step(dt); else orbit.update();
  renderer.render(scene, camera);
  labels.render(scene, camera);
});
addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labels.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
