  drawn: "Grok Bot / K.T."
  title: "Finishing Package - Main"
  changes:   # shown on the cover
    - "Bathrooms redrawn with real fixtures, tile joints and heights: master D602.1-.5, guest D603.1-.5 (plan + fixture schedule, four walls, sections for shower floor, WC frame and bath deck)."
