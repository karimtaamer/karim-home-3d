<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>K&amp;N Home</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #f3eee5; color: #2b2622; font-family: Inter, system-ui, sans-serif; }
  #scene { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; touch-action: none; }
  .ui { position: fixed; z-index: 2; }
  #bar { top: 14px; left: 14px; display: flex; flex-direction: column; align-items: flex-start; gap: 8px; max-width: 72vw; }
  #bar .row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  #bar button, #switcher button, #drawing .dbar button { border: 0; border-radius: 999px; padding: 8px 14px; background: #fffaf3e6; color: #2b2622; box-shadow: 0 1px 4px #0001, 0 0 0 1px #2b262214 inset;
    cursor: pointer; font: 500 12px Inter, sans-serif; letter-spacing: .04em; backdrop-filter: blur(6px); transition: background .2s, color .2s, transform .15s; }
  #bar button:hover, #drawing .dbar button:not(:disabled):hover { transform: translateY(-1px); }
  #drawing .dbar button:disabled { opacity: .4; cursor: default; }
  #bar button.on, #drawing .dbar button.on { background: #2b2622; color: #f3eee5; }
  /* Segmented switches (view, 3D / drawing): one pill, the chosen part dark. */
  .seg { display: flex; padding: 3px; gap: 2px; border-radius: 999px; background: #fffaf3e6; box-shadow: 0 1px 4px #0001, 0 0 0 1px #2b262214 inset; backdrop-filter: blur(6px); }
  :is(#bar, #switcher) .seg button { background: none; box-shadow: none; backdrop-filter: none; padding: 6px 13px; }
  :is(#bar, #switcher) .seg button:hover { transform: none; background: #2b26220f; }
  :is(#bar, #switcher) .seg button.on { background: #2b2622; color: #f3eee5; }
  #bar .sep { width: 1px; height: 20px; background: #2b262226; margin: 0 4px; }
  #bar .tool { font-weight: 400; }
  :is(#bar, #drawing .dbar) button svg { width: 14px; height: 14px; vertical-align: -3px; margin-right: 6px; fill: none; stroke: currentColor; stroke-width: 1.8;
    stroke-linecap: round; stroke-linejoin: round; }
  #bar :is(#measure, #move).on, #drawing .dbar [data-tool=move].on { background: #ff8a3d; color: #fff; }
  #bar button:disabled { opacity: .45; cursor: default; transform: none; }
  /* Versions and rooms: one panel at a time, folded under its chip. */
  #bar .menu::after { content: " ▾"; }
  #bar:is([data-open=versions] [data-menu=versions], [data-open=rooms] [data-menu=rooms]) { background: #2b2622; color: #f3eee5; }
  #bar:is([data-open=versions] [data-menu=versions], [data-open=rooms] [data-menu=rooms])::after { content: " ▴"; }
  #bar .panel { display: none; flex-wrap: wrap; gap: 6px; max-width: 620px; padding: 8px; border-radius: 18px; background: #fffaf3d9;
    box-shadow: 0 4px 18px #0002, 0 0 0 1px #2b262214 inset; backdrop-filter: blur(8px); }
  #bar[data-open=versions] #versions, #bar[data-open=rooms] #rooms { display: flex; }
  #bar #versions { flex-direction: column; align-items: stretch; gap: 4px; }
  #bar #versions button { text-align: left; }
  #bar #versions .vsep { border: 0; border-top: 1px solid currentColor; opacity: 0.2; margin: 3px 6px; width: auto; }
  #bar #versions button.on { background: #2b2622; color: #f3eee5; }
  #bar .panel button { font-weight: 400; padding: 6px 12px; font-size: 11.5px; box-shadow: 0 0 0 1px #2b262214 inset; }
  /* The AI actions, in the bar (desktop, tablet) or the column bottom-left (phone): Make an Edit (edit-ai.js's dock) with
     its Undo attached on the right as one split pill, and Generate a render. Both pills are the same deep brown with cream
     text; Undo shares that brown and is split off with a separator (not a white chip). Undo is icon-only until the first
     tap asks "Undo?" (edit-ai.js); Generate stays readable while disabled. */
  :is(#bar, #actions) #edit-ai-dock { position: static; flex-direction: row; align-items: stretch; gap: 0; }
  :is(#bar, #actions) :is(#photogen, #edit-ai-btn) { display: flex; align-items: center; gap: 7px; border: 0; border-radius: 999px; padding: 8px 15px;
    font: 600 12px Inter, sans-serif; letter-spacing: .03em; cursor: pointer; backdrop-filter: none; transition: transform .15s, filter .15s;
    color: #fffaf3; background: linear-gradient(180deg, #5a4636, #2b2622); box-shadow: 0 3px 12px #0003, 0 0 0 1px #e7b86640 inset; }
  :is(#bar, #actions) :is(#photogen, #edit-ai-btn):not(:disabled):hover { filter: brightness(1.15); }
  :is(#bar, #actions) :is(#edit-ai-btn, #edit-ai-undo):hover { transform: none; }
  :is(#bar, #actions) :is(#photogen, #edit-ai-btn) svg { width: 15px; height: 15px; margin: 0; fill: none; stroke: #e7b866; stroke-width: 1.8;
    stroke-linecap: round; stroke-linejoin: round; }
  :is(#bar, #actions) #photogen:disabled { opacity: 1; color: #fffaf3a6; cursor: default;
    background: linear-gradient(180deg, #4a3a2e, #2b2622); box-shadow: 0 0 0 1px #e7b86628 inset; }
  :is(#bar, #actions) #photogen:disabled svg { stroke: #e7b86680; }
  :is(#bar, #actions) #edit-ai-dock:has(#edit-ai-undo:not([hidden])) #edit-ai-btn { border-radius: 999px 0 0 999px; padding-right: 13px; }
  :is(#bar, #actions) #edit-ai-undo { gap: 0; padding: 0 11px 0 9px; border-radius: 0 999px 999px 0; font: 600 12px Inter, sans-serif; letter-spacing: .02em;
    color: #fffaf3; background: linear-gradient(180deg, #5a4636, #2b2622); box-shadow: 0 3px 12px #0003, 0 0 0 1px #e7b86640 inset;
    border-left: 1px solid #e7b86655; }
  :is(#bar, #actions) #edit-ai-undo.sure { gap: 5px; padding: 0 13px 0 11px; filter: brightness(1.12); }
  :is(#bar, #actions) #edit-ai-undo svg { width: 13px; height: 13px; margin: 0; stroke: #e7b866; stroke-width: 2; }
  :is(#bar, #actions) #edit-ai-undo.sure svg { stroke: #e7b866; }
  #switcher { top: 84px; right: 22px; z-index: 4; }
  #switcher .short { display: none; }
  body:is(.drawing, .renders) :is(#help, #stick, #caption, #shade) { display: none; }
  /* Over the drawing and the renders only the version chip stays, so each version's can be looked at
     (and Make an Edit beside it over the drawing; edit-ai.js hides it under Renders). */
  body:is(.drawing, .renders) #bar { z-index: 4; }
  body:is(.drawing, .renders) #bar :is(.row > :not([data-menu=versions], #edit-ai-dock), .panel:not(#versions)) { display: none; }
  body.drawing #title h1 { color: #e8e2d8; }
  body:is(.drawing, .renders) #title { z-index: 4; }
  /* Renders: the designer's images room by room, on paper, below the title and the switch. */
  #renders { position: fixed; inset: 0; z-index: 3; background: #f3eee5; overflow-y: auto; }
  #renders[hidden], #renders .rbox[hidden] { display: none; }
  #renders .rlist { padding: 132px 22px 40px; }
  #renders section { margin-bottom: 34px; }
  #renders h2 { display: flex; align-items: baseline; gap: 10px; margin: 0 0 12px; padding-bottom: 8px; border-bottom: 1px solid #2b26221f;
    font: 400 30px "Cormorant Garamond", serif; }
  #renders h2 span { font: 500 11px Inter, sans-serif; letter-spacing: .1em; color: #6d645b; }
  #renders .rgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
  #renders figure { margin: 0; cursor: zoom-in; }
  #renders figure img { display: block; width: 100%; aspect-ratio: 16 / 10; object-fit: cover; border-radius: 10px; background: #e6dccf;
    box-shadow: 0 1px 4px #0001; transition: transform .2s; }
  #renders figure:hover img { transform: translateY(-2px); }
  #renders figcaption { margin-top: 6px; font-size: 11.5px; letter-spacing: .04em; color: #6d645b; }
  #renders .rbox { position: fixed; inset: 0; z-index: 6; display: grid; place-items: center; background: #1c1814f2; }
  #renders .rbox img { max-width: 90vw; max-height: 84vh; object-fit: contain; }
  #renders .rcap { position: absolute; left: 22px; bottom: 18px; color: #f3eee5; font-size: 13px; letter-spacing: .06em; }
  #renders .rbox button { position: absolute; width: 44px; height: 44px; border: 0; border-radius: 999px; background: #fffaf31f; color: #f3eee5;
    font-size: 22px; cursor: pointer; }
  #renders .rbox .rclose { top: 18px; right: 22px; font-size: 16px; }
  #renders .rprev { left: 22px; top: calc(50% - 22px); }
  #renders .rnext { right: 22px; top: calc(50% - 22px); }
  /* Edit / Delete under the large render, each opening a sheet (touch-sized: 44 px buttons). */
  #renders :is(.racts, .rsheet)[hidden] { display: none; }
  #renders .racts { position: absolute; right: 22px; bottom: 12px; display: flex; gap: 8px; }
  #renders .rbox :is(.racts, .rsheet) button { position: static; width: auto; min-height: 44px; padding: 0 18px; font: 500 13px Inter, sans-serif;
    letter-spacing: .04em; border-radius: 999px; }
  #renders .rsheet { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); width: min(460px, calc(100vw - 24px));
    display: flex; flex-direction: column; gap: 10px; padding: 18px; border-radius: 16px; background: #f3eee5; color: #2b2622; box-shadow: 0 8px 30px #0008; }
  #renders .rsheet label { display: flex; flex-direction: column; gap: 6px; font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: #6d645b; }
  #renders .rsheet textarea { min-height: 52px; font: 16px Inter, sans-serif; color: #2b2622; background: #fffaf3; border: 0; border-radius: 10px;
    padding: 10px 12px; box-shadow: 0 0 0 1px #2b262226 inset; resize: vertical; }
  #renders .rsheet p { margin: 0; font-size: 14px; }
  #renders .rsheet .rnote { font-size: 12px; color: #6d645b; }
  #renders .rerr { font-size: 12px; color: #b3412e; }
  #renders .rerr:empty { display: none; }
  #renders .rrow { display: flex; gap: 8px; }
  #renders .rbox .rsheet button { background: #fffaf3; color: #2b2622; box-shadow: 0 0 0 1px #2b262226 inset; }
  #renders .rbox .rsheet .rgo { background: #2b2622; color: #f3eee5; }
  #renders .rbox .rsheet .rdanger { background: #b3412e; }
  #renders .rbox .rsheet button:disabled { opacity: .5; }
  /* Edit: the sheet moves beside the render, which stays clear to circle on (markedit.js). */
  #renders .rbox.marking { padding-right: 400px; }
  #renders .rbox.marking img { max-width: calc(100vw - 460px); }
  #renders .rbox.marking .redit { left: auto; right: 22px; top: 76px; bottom: auto; transform: none; width: 360px; max-height: calc(100vh - 100px); overflow-y: auto; }
  #renders .rbox.marking :is(.rprev, .rnext) { display: none; }
  /* Tape measure over the 3D scene, and the 2D drawing (AutoCAD-dark, like model space). */
  .measure-overlay { position: fixed; inset: 0; z-index: 1; pointer-events: none; }
  .measure-overlay svg { width: 100%; height: 100%; }
  .measure-overlay line { stroke: #ff8a3d; stroke-width: 2.5; stroke-linecap: round; }
  .measure-overlay line.halo { stroke: #fffaf3; stroke-width: 5.5; stroke-dasharray: none; }
  .measure-overlay circle { fill: #ff8a3d; stroke: #fffaf3; stroke-width: 2; }
  .measure-overlay circle.hover { fill: none; stroke: #ff8a3d; stroke-width: 2.5; }
  .measure-overlay .snap { fill: none; stroke: #2b2622; stroke-width: 2; }
  /* Move and Resize (move.js): the picked piece's plan box with edge and corner handles, its name and size, the drill-in
     trail and part chips; a draft shows where it was (dashed) and waits for Accept / Cancel. */
  .move-overlay { position: fixed; inset: 0; z-index: 3; pointer-events: none; }
  body.drawing .move-overlay { z-index: 4; }
  .move-overlay svg { width: 100%; height: 100%; }
  .move-overlay polygon { fill: #ff8a3d1f; stroke: #ff8a3d; stroke-width: 2; stroke-linejoin: round; }
  .move-overlay polygon.halo { fill: none; stroke: #fffaf3; stroke-width: 5; }
  .move-overlay circle { fill: #fffaf3; stroke: #ff8a3d; stroke-width: 2.5; }
  .move-overlay circle.corner { fill: #ff8a3d; stroke: #fffaf3; stroke-width: 2; }
  .move-overlay line.rot { stroke: #ff8a3d; stroke-width: 1.5; }
  .move-overlay circle.rot { fill: #ff8a3d; stroke: #fffaf3; stroke-width: 2.5; }
  .move-label { position: absolute; transform: translate(-50%, calc(-100% - 10px)); background: #2b2622; color: #f3eee5; font: 500 12px Inter, sans-serif;
    padding: 3px 9px; border-radius: 999px; white-space: nowrap; box-shadow: 0 1px 4px #0003; }
  .move-chips { position: absolute; transform: translateX(-50%); display: flex; gap: 6px; pointer-events: auto; }
  .move-chips button { font: 500 12px Inter, sans-serif; padding: 5px 11px; border-radius: 999px; border: 0; background: #fffaf3f2; color: #2b2622;
    box-shadow: 0 1px 4px #0003; cursor: pointer; white-space: nowrap; }
  .move-chips button.on { background: #ff8a3d; color: #fff; }
  .move-chips button.part { background: #2b2622e6; color: #f3eee5; }
  .move-overlay polygon.was { fill: none; stroke: #2b2622; stroke-width: 1.5; stroke-dasharray: 5 4; opacity: 0.7; }
  .move-label.draft { background: #ff8a3d; color: #fff; }
  #move-accept { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 7; display: flex; gap: 8px; align-items: center;
    max-width: min(520px, calc(100vw - 24px)); padding: 8px 8px 8px 16px; border-radius: 16px; background: #2b2622f2; color: #f3eee5;
    font: 500 12.5px Inter, sans-serif; box-shadow: 0 6px 20px #0004; }
  #move-accept[hidden] { display: none; }
  #move-accept .what { flex: 1; }
  #move-accept button { border: 0; border-radius: 999px; padding: 8px 16px; font: 600 12.5px Inter, sans-serif; cursor: pointer; }
  #move-accept .accept { background: #ff8a3d; color: #fff; }
  #move-accept .cancel { background: none; color: #f3eee5; box-shadow: inset 0 0 0 1px #f3eee566; }
  #move-accept.busy button { opacity: 0.4; pointer-events: none; }
  #move-toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 6; display: flex; gap: 8px; align-items: center;
    max-width: min(420px, calc(100vw - 24px)); padding: 10px 10px 10px 16px; border-radius: 16px; background: #2b2622f2; color: #f3eee5;
    font: 12.5px Inter, sans-serif; box-shadow: 0 6px 20px #0004; }
  #move-toast.bad { background: #7a2b22f2; }
  #move-toast span { flex: 1; }
  #move-toast button { border: 0; border-radius: 999px; padding: 6px 12px; font: 600 12px Inter, sans-serif; background: #f3eee5; color: #2b2622; cursor: pointer; }
  #move-toast button.ghost { background: none; color: #f3eee5; padding: 6px 8px; }
  @media (pointer: fine) { body.drawing.moving #drawing canvas { cursor: default; } }
  .measure-overlay .labels div { position: absolute; transform: translate(-50%, -150%); background: #2b2622; color: #f3eee5; font: 500 12px Inter, sans-serif;
    padding: 3px 9px; border-radius: 999px; white-space: nowrap; box-shadow: 0 1px 4px #0003; }
  #drawing { position: fixed; inset: 0; z-index: 3; background: #212830; }
  #drawing[hidden] { display: none; }
  #drawing canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
  @media (pointer: fine) { #drawing canvas { cursor: none; } }
  #drawing .dbar { position: absolute; top: 60px; left: 14px; display: flex; flex-wrap: wrap; gap: 6px; }
  #drawing .dbar button { background: #2f3742e6; color: #d8dee6; box-shadow: 0 0 0 1px #ffffff1f inset; }
  #drawing .dbar button.on { background: #f3eee5; color: #2b2622; }
  #drawing .dstatus { position: absolute; left: 14px; bottom: 14px; display: flex; gap: 18px; font: 11.5px ui-monospace, Menlo, monospace; color: #c9d1d9;
    background: #161b22cc; padding: 7px 11px; border-radius: 8px; pointer-events: none; }
  #drawing .dstatus span:empty, #drawing .dstatus:not(:has(span:not(:empty))) { display: none; }
  #drawing .dhelp { position: absolute; right: 14px; bottom: 14px; font-size: 11.5px; color: #9aa4ae; pointer-events: none; text-align: right; max-width: 46vw; }
  #help { bottom: 14px; left: 14px; font-size: 11.5px; color: #6d645b; background: #fffaf3cc; padding: 7px 11px; border-radius: 999px; }
  #title { top: 18px; right: 22px; text-align: right; pointer-events: none; }
  #title h1 { font-family: "Cormorant Garamond", serif; font-weight: 400; font-size: 34px; margin: 0; line-height: 1; }
  #title p { margin: 6px 0 0; font-size: 10px; letter-spacing: .3em; text-transform: uppercase; color: #6d645b; }
  #shade { left: 0; right: 0; bottom: 0; height: 36vh; background: linear-gradient(to top, #1c181499, #1c181400); opacity: 0; transition: opacity .5s; pointer-events: none; }
  #caption { left: 5vw; bottom: 9vh; color: #fff; text-shadow: 0 1px 18px #0006; opacity: 0; pointer-events: none; }
  #caption .name { font-family: "Cormorant Garamond", serif; font-size: clamp(38px, 4.6vw, 70px); line-height: 1.02; }
  #caption .meta { font-size: 13px; letter-spacing: .1em; opacity: .9; margin-top: 4px; }
  .plan-label { font-size: 9px; letter-spacing: .22em; line-height: 1.5; text-transform: uppercase; color: #2b2622; text-align: center; max-width: 84px;
    pointer-events: none; background: #f3eee5d9; padding: 1px 4px; }
  #loader { position: fixed; inset: 0; z-index: 5; background: #f3eee5; display: grid; place-items: center; }
  #loader div { font-family: "Cormorant Garamond", serif; font-size: 42px; letter-spacing: .18em; }
  #loader span { display: inline-block; opacity: 0; }
  #bar .break, #stick, :is(#bar, #actions) #photogen[hidden] { display: none; }
  #actions { display: contents; }
  /* Phones and tablets (a touch screen, or any narrow window): a joystick to walk with bottom-right, and the measuring
     help bottom-left. On phones Generate a render and Make an Edit (with its Undo) sit in that column too, touch-sized. */
  @media (max-width: 760px), (pointer: coarse) {
    #actions { left: 14px; right: 14px; bottom: 14px; z-index: 4; display: flex; flex-direction: column; align-items: flex-start; gap: 8px; pointer-events: none; }
    #actions > * { pointer-events: auto; }
    body.walking #actions { right: 152px; }
    #actions #help { position: static; border-radius: 12px; }
    #actions #help:empty { display: none; }
    body:is(:not(.walking), .drawing, .renders) #actions #photogen { display: none; }
    #actions :is(#photogen, #edit-ai-btn) { min-height: 44px; padding: 0 16px; font-size: 13px; }
    #actions :is(#photogen, #edit-ai-btn) svg { width: 16px; height: 16px; }
    #actions #edit-ai-dock:has(#edit-ai-undo:not([hidden])) #edit-ai-btn { padding-right: 14px; }
    #actions #edit-ai-undo { min-height: 44px; padding: 0 13px 0 11px; font-size: 12.5px; }
    #actions #edit-ai-undo.sure { padding: 0 14px 0 12px; }
    body.walking:not(.drawing, .renders) #stick { display: block; }
    #stick { right: 14px; bottom: 14px; width: 124px; height: 124px; border-radius: 50%; background: #fffaf3b3; box-shadow: 0 1px 6px #0002, 0 0 0 1px #2b262214 inset;
      backdrop-filter: blur(6px); touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
    #stick .knob { position: absolute; left: 50%; top: 50%; width: 54px; height: 54px; margin: -27px 0 0 -27px; border-radius: 50%; background: #fffaf3;
      box-shadow: 0 2px 8px #0003, 0 0 0 1px #2b26221f inset; pointer-events: none; transition: transform .15s; }
    #stick.held .knob { background: #2b2622; transition: none; }
    #caption { bottom: 236px; }
  }
  /* Phones: the views up top, rooms folded behind one chip. */
  @media (max-width: 760px) {
    #title { top: 12px; left: 14px; right: auto; text-align: left; }
    #title h1 { font-size: 24px; }
    #title p { display: none; }
    #bar { top: 46px; left: 12px; right: 12px; max-width: none; }
    #bar .break { display: block; flex-basis: 100%; height: 0; }
    #bar .sep { display: none; }
    #bar .panel { max-height: 46vh; overflow-y: auto; }
    #switcher { top: 10px; right: 12px; }
    #switcher .long { display: none; }
    #switcher .short { display: inline; }
    body:is(.drawing, .renders) #title { display: none; }
    #switcher .seg button { padding: 6px 10px; }
    #renders .rlist { padding: 96px 12px 28px; }
    #renders .rgrid { grid-template-columns: 1fr; }
    #renders .racts { left: 12px; right: 12px; bottom: 54px; justify-content: center; }
    #renders .rcap { left: 12px; right: 12px; text-align: center; }
    #renders .rbox.marking { padding: 64px 0 0; place-items: start center; }
    #renders .rbox.marking img { max-width: 100vw; max-height: 42vh; }
    #renders .rbox.marking .redit { left: 12px; right: 12px; top: auto; bottom: 12px; width: auto; max-height: 50vh; }
    #renders .rbox.marking .rcap { display: none; }
    #drawing .dbar { top: 92px; left: 12px; right: 12px; }
    #drawing .dstatus { bottom: 44px; left: 12px; right: 12px; flex-direction: column; gap: 2px; }
    #drawing .dhelp { left: 12px; right: 12px; bottom: 14px; max-width: none; text-align: left; }
  }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
  "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.12.5/index.js"
} }
</script>
</head>
<body>
<div id="loader"><div>K&amp;N Home</div></div>
<canvas id="scene"></canvas>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { PointerLockControls } from "three/addons/controls/PointerLockControls.js";
import { CSS2DRenderer, CSS2DObject } from "three/addons/renderers/CSS2DRenderer.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";
import gsap from "gsap";
import { liveFiles, liveImport, createEditAI } from "./edit-ai.js";
import { createDrawing, loadDrawing } from "./drawing.js";
import { createMeasure } from "./measure.js";
import { createMove } from "./move.js";
import { createRenders } from "./renders.js";
import { createPhotoGen } from "./photogen.js";
import { createInteract } from "./interact.js";

// --- Plan versions: the main plan and alternatives to it, each built from its own DWG ----------------
// (build_geometry.py --out / --tour, build_drawing.py --out). ?v=<id> picks one; the main plan is the default.
// `data`: the plan version whose files, Edit AI live edits and furnish.js branch an entry loads (default: its id).
// Main is Karim's layout (2026-10-25): it loads the kareems-changes plan. "Karim's version" was an alias to it until
// 26 Oct 2026; it now loads its own karims-version plan (a copy of Main from before Main's laundry/WC change), so an
// edit on one no longer shows on the other. `sep`: a divider above the entry in the menu.
const VERSIONS = [
  { id: "main", name: "Main", data: "kareems-changes", model: "model-kareems-changes.js", drawing: "drawing-kareems-changes.json",
    spots: "spots-kareems-changes.json" },
  { id: "as-built", name: "As-built", model: "model-as-built.js", drawing: "drawing-as-built.json", spots: "spots-as-built.json" },
  { id: "kareems-changes", name: "Karim's version", data: "karims-version", model: "model-karims-version.js",
    drawing: "drawing-karims-version.json", spots: "spots-karims-version.json", sep: true },
  { id: "naghams-changes", name: "Nagham's version", model: "model-naghams-changes.js", drawing: "drawing-naghams-changes.json",
    spots: "spots-naghams-changes.json" },
];
const params = new URLSearchParams(location.search);
const version = VERSIONS.find(v => v.id === params.get("v")) || VERSIONS[0];
const vid = version.data || version.id;  // the plan version on screen
// Edit AI's live changes to this version (edit-ai.js): its files stand in for the deployed ones until git catches up.
const live = await liveFiles(vid);
const { makeMaterials } = await liveImport(live, "materials.js");
const { furnish } = await liveImport(live, "furnish.js");
await new Promise((onload, onerror) => document.head.appendChild(Object.assign(document.createElement("script"), { src: live.url(version.model), onload, onerror })));

// --- The flat, built from window.MODEL (all geometry comes from the DWG via build_geometry.py) ---

const PAPER = 0xf3eee5;
const INK = 0x2b2622;

// Floor finishes (keys used by tour.json "finishes") and the library material each one uses.
const FINISH = { wood: "oak", tile: "stone", decking: "deck" };
const DEFAULT_FINISH = { dry: "wood", wet: "tile", outdoor: "decking" };
const STONE_WALLS = /toilet|bath|wc|shower/i;  // rooms lined in stone to the ceiling (per renders)
const SKIRTING = 0.08;

// Plan (x, y) metres -> world (x, 0, -y); shapes are extruded upwards.
function shape(ring, holes = []) {
  const s = new THREE.Shape(ring.map(([x, y]) => new THREE.Vector2(x, y)));
  s.holes = holes.map(h => new THREE.Path(h.map(([x, y]) => new THREE.Vector2(x, y))));
  return s;
}

function flatMesh(ring, holes, material, y) {
  const g = new THREE.ShapeGeometry(shape(ring, holes));
  g.rotateX(-Math.PI / 2);
  const m = new THREE.Mesh(g, material);
  m.position.y = y;
  return m;
}

function pointInRing([x, y], ring) {
  let hit = false;
  for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
    const [xi, yi] = ring[i], [xj, yj] = ring[j];
    if ((yi > y) !== (yj > y) && x < ((xj - xi) * (y - yi)) / (yj - yi) + xi) hit = !hit;
  }
  return hit;
}

function ringCentroid(ring) {
  let a = 0, x = 0, y = 0;
  for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
    const f = ring[j][0] * ring[i][1] - ring[i][0] * ring[j][1];
    a += f; x += (ring[j][0] + ring[i][0]) * f; y += (ring[j][1] + ring[i][1]) * f;
  }
  return [x / (3 * a), y / (3 * a)];
}

function ringArea(ring) {
  let a = 0;
  for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) a += ring[j][0] * ring[i][1] - ring[i][0] * ring[j][1];
  return Math.abs(a) / 2;
}

function buildFlat(M, scene) {
  // Everything above the cut plane is clipped: 1.2 m reads as a floor plan, 1000 shows full walls.
  const cutPlane = new THREE.Plane(new THREE.Vector3(0, -1, 0), 1000);
  const clip = [cutPlane];
  const lib = makeMaterials(clip);
  const mat = {
    wall: lib.limewash,
    // The inside of a clipped wall, seen from above, is the solid ink of a drawn plan.
    wallCut: new THREE.MeshBasicMaterial({ color: INK, side: THREE.BackSide, clippingPlanes: clip, toneMapped: false }),
    glass: new THREE.MeshPhysicalMaterial({ color: 0xcfe2ea, transparent: true, opacity: 0.16, roughness: 0.05, clippingPlanes: clip }),
    frosted: new THREE.MeshPhysicalMaterial({ color: 0xeef3f4, transparent: true, opacity: 0.82, roughness: 0.7, clippingPlanes: clip }),
    frame: lib.blackSteel,
    // Ceilings face down only, so they vanish from above and close the room from inside.
    ceiling: new THREE.MeshStandardMaterial({ color: 0xf4e6d6, emissive: 0x5a4f45, roughness: 1, side: THREE.BackSide, clippingPlanes: clip }),
    paper: new THREE.MeshBasicMaterial({ color: PAPER, toneMapped: false }),
  };

  const solids = [];
  function prism(ring, holes, base, top, material = mat.wall) {
    const g = new THREE.ExtrudeGeometry(shape(ring, holes), { depth: top - base, bevelEnabled: false });
    g.rotateX(-Math.PI / 2);
    const face = new THREE.Mesh(g, material);
    face.position.y = base;
    const glazed = material === mat.glass || material === mat.frosted;
    face.castShadow = face.receiveShadow = !glazed;
    scene.add(face);
    if (!glazed) {
      const cut = new THREE.Mesh(g, mat.wallCut);
      cut.position.y = base;
      scene.add(cut);
      solids.push(face);
    }
    return face;
  }

  for (const w of M.walls) prism(w.outer, w.holes, 0, w.height, w.height < M.ceiling ? lib.render : mat.wall);
  for (const o of M.openings) {
    if (o.kind === "door") {
      prism(o.outer, [], M.doorHead, M.ceiling);
    } else if (o.kind === "slider") {
      prism(o.outer, [], M.sliderHead, M.ceiling);
      prism(o.outer, [], 0, M.sliderHead, mat.glass);
      frame(o.outer, 0, M.sliderHead, 2);
    } else {  // a window may carry its own sill / head / frosted glass (build_geometry.py --window)
      const sill = o.sill ?? M.sill, head = o.head ?? M.winHead;
      prism(o.outer, [], 0, sill);
      prism(o.outer, [], head, M.ceiling);
      prism(o.outer, [], sill, head, o.frosted ? mat.frosted : mat.glass);
      frame(o.outer, sill, head, 1);
    }
  }

  // Slim black frames round the glazing (as in the renders), in the middle of the wall.
  function frame(ring, z0, z1, panes) {
    const [a, b, c] = ring;
    const long = Math.hypot(b[0] - a[0], b[1] - a[1]) >= Math.hypot(c[0] - b[0], c[1] - b[1]);
    const [p, q] = long ? [a, b] : [b, c];
    const off = long ? [(c[0] - b[0]) / 2, (c[1] - b[1]) / 2] : [(a[0] - b[0]) / 2, (a[1] - b[1]) / 2];
    const L = Math.hypot(q[0] - p[0], q[1] - p[1]), ang = Math.atan2(q[1] - p[1], q[0] - p[0]);
    const at = t => [p[0] + off[0] + (q[0] - p[0]) * t, p[1] + off[1] + (q[1] - p[1]) * t];
    const bar = (t0, t1, h0, h1) => {
      const [x0, y0] = at(t0), [x1, y1] = at(t1);
      const m = new THREE.Mesh(new THREE.BoxGeometry(Math.max(0.04, Math.hypot(x1 - x0, y1 - y0)), h1 - h0, 0.05), mat.frame);
      m.position.set((x0 + x1) / 2, (h0 + h1) / 2, -(y0 + y1) / 2);
      m.rotation.y = ang;
      scene.add(m);
    };
    const e = 0.02 / L;
    bar(0, 1, z0, z0 + 0.05); bar(0, 1, z1 - 0.05, z1);
    for (let k = 0; k <= panes; k++) bar(k / panes - (k ? e : -e), k / panes - (k ? e : -e), z0, z1);
  }

  // Room linings from the DWG skins: stone to the ceiling in bathrooms, oak skirting elsewhere.
  for (const s of M.skins || []) {
    const stone = STONE_WALLS.test(s.room);
    const g = new THREE.ExtrudeGeometry(shape(s.outer, s.holes), { depth: stone ? M.ceiling - 0.002 : SKIRTING, bevelEnabled: false });
    g.rotateX(-Math.PI / 2);
    const m = new THREE.Mesh(g, stone ? lib.stoneWall : lib.oakVeneer);
    m.receiveShadow = true;
    scene.add(m);
  }

  // Rooms: a paper floor (the drawing) under a finished floor that fades in, plus the room's
  // share of the plan linework and a warm light, so each room can "come alive" on its own.
  const finishes = M.tour?.finishes || {};
  const rooms = {};
  const room = name => (rooms[name] ??= {
    name, kind: "dry", rings: [], area: 0, floors: [], ceilings: [],
    lineMat: new THREE.LineBasicMaterial({ color: INK, transparent: true, opacity: 1, toneMapped: false }),
    centre: new THREE.Vector3(), light: null, reveal: 0,
  });
  for (const f of M.floor) {
    const r = room(f.room);
    r.kind = f.kind;
    r.rings.push(f.outer);
    r.area += ringArea(f.outer) - f.holes.reduce((a, h) => a + ringArea(h), 0);
    const paper = flatMesh(f.outer, f.holes, mat.paper, 0);
    paper.receiveShadow = true;
    scene.add(paper);
    const fm = lib[FINISH[finishes[f.room] || DEFAULT_FINISH[f.kind]] || FINISH.wood].clone();
    fm.clippingPlanes = null;
    fm.transparent = true;
    fm.opacity = 0;
    const floorMesh = flatMesh(f.outer, f.holes, fm, 0.002);
    floorMesh.receiveShadow = true;
    scene.add(floorMesh);
    r.floors.push(floorMesh);
    if (f.kind !== "outdoor") {
      const c = flatMesh(f.outer, f.holes, mat.ceiling, M.ceiling);
      scene.add(c);
      r.ceilings.push(c);
    }
  }
  for (const r of Object.values(rooms)) {
    const [cx, cy] = ringCentroid(r.rings.reduce((a, b) => (ringArea(b) > ringArea(a) ? b : a)));
    r.centre.set(cx, 0, -cy);
    if (r.kind !== "outdoor") {
      r.light = new THREE.PointLight(0xffc68a, 0, 7, 1.4);
      r.light.position.set(cx, M.ceiling - 0.35, -cy);
      scene.add(r.light);
    }
  }
  const roomAt = (x, y) => Object.values(rooms).find(r => r.rings.some(ring => pointInRing([x, y], ring)));

  // Plan linework, grouped by the room it sits in (walls and windows stay as permanent ink).
  // Door swings are redrawn cleanly from the detected doors: a quarter arc and the open leaf.
  const lines = [...M.lines];
  const leaves = [];
  for (const s of M.swings || []) {
    const [hx, hy] = s.hinge;
    const a0 = Math.atan2(s.closed[1] - hy, s.closed[0] - hx);
    // The side the drawing swings it where the build kept that (s.open), else the first side that lands in a room.
    const sides = [Math.PI / 2, -Math.PI / 2].map(d => ({ d, end: [hx + Math.cos(a0 + d) * s.r, hy + Math.sin(a0 + d) * s.r] }));
    const sweep = (s.open ? sides.sort((a, b) => Math.hypot(a.end[0] - s.open[0], a.end[1] - s.open[1]) - Math.hypot(b.end[0] - s.open[0], b.end[1] - s.open[1]))[0]
      : sides.find(o => roomAt(...o.end))) || { d: Math.PI / 2 };
    const arc = [];
    for (let k = 0; k <= 24; k++) arc.push([hx + Math.cos(a0 + (sweep.d * k) / 24) * s.r, hy + Math.sin(a0 + (sweep.d * k) / 24) * s.r]);
    lines.push({ kind: "door", pts: arc }, { kind: "door", pts: [[hx, hy], arc[arc.length - 1]] });
    // The leaf itself, standing open where the drawing swings it (the front door is shown shut).
    const front = M.tour?.start && Math.hypot(hx - M.tour.start[0], hy - M.tour.start[1]) < 2.2;
    const [ex, ey] = front ? s.closed : arc[arc.length - 1];
    const leaf = new THREE.Mesh(new THREE.BoxGeometry(s.r - 0.02, M.doorHead - 0.01, 0.04), lib.oakVeneer);
    leaf.position.set((hx + ex) / 2, (M.doorHead - 0.01) / 2, -(hy + ey) / 2);
    leaf.rotation.y = Math.atan2(ey - hy, ex - hx);
    leaf.castShadow = leaf.receiveShadow = true;
    scene.add(leaf);
    leaves.push(leaf);
  }
  const groups = new Map();
  const shared = new THREE.LineBasicMaterial({ color: INK, toneMapped: false });
  for (const l of lines) {
    const mid = l.pts[Math.floor(l.pts.length / 2)];
    const r = l.kind === "furniture" || l.kind === "door" ? roomAt(mid[0], mid[1]) : null;
    const key = r ? r.name : "";
    if (!groups.has(key)) groups.set(key, []);
    const arr = groups.get(key);
    for (let i = 1; i < l.pts.length; i++) {
      arr.push(l.pts[i - 1][0], 0.012, -l.pts[i - 1][1], l.pts[i][0], 0.012, -l.pts[i][1]);
    }
  }
  for (const [key, arr] of groups) {
    const g = new THREE.BufferGeometry();
    g.setAttribute("position", new THREE.Float32BufferAttribute(arr, 3));
    const lines = new THREE.LineSegments(g, key ? rooms[key].lineMat : shared);
    scene.add(lines);
  }

  function setReveal(r, t) {
    r.reveal = t;
    for (const f of r.floors) {
      f.material.opacity = t;
      f.material.transparent = t < 1;
    }
    r.lineMat.opacity = 1 - t;
    r.lineMat.visible = t < 0.999;
    if (r.light) r.light.intensity = 2 * t;
  }

  const furniture = furnish(scene, M, lib, vid);
  return { cutPlane, solids, rooms, roomAt, setReveal, materials: mat, lib, furniture, leaves };
}


// --- Viewer ---------------------------------------------------------------------------------
const M = window.MODEL;
const EYE = 1.6;
const PLAN_CUT = 1.2;
const FULL = M.ceiling + 0.05;  // at or above this the walls are shown whole
const FOV = { top: 2.2, walk: 70 };
const toWorld = ([x, y], h = 0) => new THREE.Vector3(x, h, -y);
const lerp = (a, b, t) => a + (b - a) * t;
const UP = new THREE.Vector3(0, 1, 0);
const NORTH_UP = new THREE.Vector3(0, 0, -1);  // plan drawn the right way up when looking down

const canvas = document.getElementById("scene");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.localClippingEnabled = true;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.85;
const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: "fixed", inset: 0, pointerEvents: "none", zIndex: 1 });
document.body.appendChild(labelRenderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(PAPER);
const camera = new THREE.PerspectiveCamera(FOV.walk,innerWidth / innerHeight, 0.05, 4000);
const [W, D] = M.bounds;
const centre = new THREE.Vector3(W / 2, 0, -D / 2);

// Soft reflections from a neutral studio environment, a warm sky/bounce fill and a low
// golden-hour sun from the south-west (the renders' warm glow).
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.3;
scene.add(new THREE.HemisphereLight(0xfff4e6, 0xc9a77f, 0.8));
const sun = new THREE.DirectionalLight(0xffd29a, 2.0);
sun.position.set(centre.x - 14, 16, centre.z + 12);
sun.target.position.copy(centre);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
Object.assign(sun.shadow.camera, { left: -16, right: 16, top: 16, bottom: -16, near: 1, far: 70 });
sun.shadow.bias = -0.0004;
scene.add(sun, sun.target);

const flat = buildFlat(M, scene);
const paper = new THREE.Color(PAPER);
const sky = (() => {  // a soft evening sky for walking (seen through windows and on the terrace)
  const c = document.createElement("canvas");
  c.width = 4; c.height = 256;
  const g = c.getContext("2d"), grad = g.createLinearGradient(0, 0, 0, 256);
  grad.addColorStop(0, "#5f93cc"); grad.addColorStop(0.38, "#a9c8e4"); grad.addColorStop(0.49, "#f1dcc4"); grad.addColorStop(0.5, "#e9d2b4"); grad.addColorStop(1, "#cdb79c");
  g.fillStyle = grad; g.fillRect(0, 0, 4, 256);
  const t = new THREE.CanvasTexture(c);
  t.mapping = THREE.EquirectangularReflectionMapping;
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
})();
// Post-processing: a gentle bloom so LED strips, downlights and lamp shades glow like the renders.
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.4, 0.35, 1.5);
composer.addPass(bloom);
composer.addPass(new OutputPass());
const rooms = flat.rooms;
const viewpoints = M.tour.stops.map(s => ({ ...s, eye: toWorld(s.eye, EYE), look: toWorld(s.look, EYE - 0.15) }));

// --- Look of the flat: wall cut height, drawing vs finished rooms, ceilings ------------------
const look = { cut: FULL, finish: 1 };
function applyLook() {
  flat.cutPlane.constant = look.cut >= FULL ? 1000 : look.cut;
  flat.materials.wallCut.visible = look.cut < FULL;
  for (const r of Object.values(rooms)) flat.setReveal(r, look.finish);
  flat.furniture.setReveal(look.finish);
  flat.leaves.forEach(l => (l.visible = look.finish > 0.01));
  const ceilings = mode === "walk";
  for (const r of Object.values(rooms)) r.ceilings.forEach(c => (c.visible = ceilings));
  flat.furniture.ceilingBits.visible = ceilings && look.finish > 0.01;
  scene.background = mode === "walk" ? sky : paper;
}

// --- Room labels (top view) ------------------------------------------------------------------
const planLabels = [];
for (const v of viewpoints) {
  const r = rooms[v.room];
  if (!r) continue;
  const el = document.createElement("div");
  el.className = "plan-label";
  el.textContent = v.caption;
  const obj = new CSS2DObject(el);
  obj.position.copy(r.centre).setY(0.05);
  scene.add(obj);
  planLabels.push(el);
}

// --- Camera poses and smooth transitions ------------------------------------------------------
const aspect = () => innerWidth / innerHeight;
const fitDist = fov => (Math.max(D / 2, W / 2 / aspect()) * 1.18) / Math.tan(THREE.MathUtils.degToRad(fov) / 2);
function topPose() {
  return { pos: centre.clone().setY(fitDist(FOV.top)), target: centre.clone(), fov: FOV.top, up: NORTH_UP.clone() };
}
function currentPose() {
  const dir = new THREE.Vector3();
  camera.getWorldDirection(dir);
  const target = mode === "walk" ? camera.position.clone().add(dir) : orbitTop.target.clone();
  return { pos: camera.position.clone(), target, fov: camera.fov, up: camera.up.clone() };
}
function setPose(p) {
  camera.position.copy(p.pos);
  camera.up.copy(p.up).normalize();
  camera.fov = p.fov;
  fitNear();
  camera.lookAt(p.target);
}
// Depth precision: the top view sits ~300 m up with a narrow lens; keep the near plane in step
// with the camera height or the linework 12 mm above the floor drowns in the floor.
function fitNear() {

  setMode("walk");
  look.cut = FULL; look.finish = 1; applyLook();
  setPose({ pos: toWorld(cam, cam[2]), target: toWorld(cam.slice(3), cam[5]), fov: cam[6] || FOV.walk, up: UP });
} else if (startRoom) {
  setMode("walk");
  look.cut = FULL; look.finish = 1; applyLook();
  setPose({ pos: startRoom.eye, target: startRoom.look, fov: FOV.walk, up: UP });
} else if (params.get("view") === "top") {
  setMode("top");
  look.cut = PLAN_CUT; look.finish = 1; applyLook();
  setPose(topPose());
  orbitTop.target.copy(centre); orbitTop.enabled = true;
} else {  // default: Walk inside; legacy ?view=dollhouse maps here too
  const first = viewpoints.find(v => v.room === "RECEPTION") || viewpoints[0];
  setMode("walk");
  look.cut = FULL; look.finish = 1; applyLook();
  setPose({ pos: first.eye.clone(), target: first.look.clone(), fov: FOV.walk, up: UP.clone() });
  arrive(first);
}
// Photo spots: the designer's renders at marked spots in Walk (spots.js), and all of them under Renders.
import("./spots.js").then(m => m.photoSpots({
  file: version.spots, THREE, gsap, camera, scene, toWorld, FOV, EYE, UP,
  isWalking: () => mode === "walk", isBusy: () => !!(tween || glide),
})).then(({ renders: list, add, remove }) => {
  addSpot = add;
  removeSpot = remove;
  showRenders(list);
});


// --- Edit AI: freeze the 3D or the 2D, circle what to change, say how (edit-ai.js, edit_ai.py) -----------
if (!params.has("clean")) createEditAI({
  THREE, camera, scene, live, showing: () => showing, mode: () => mode, furniture: flat.furniture.root, materials: flat.lib,
  cutPlane: flat.cutPlane, room: () => flat.roomAt(camera.position.x, -camera.position.z)?.name, drawingFrame: () => drawing.frame(),
  freeMouse: () => walker.isLocked && walker.unlock(),
});

// Desktops and tablets: Make an Edit (edit-ai.js's dock, with its Undo) then Generate a render at the end of the bar.
// Phones: both in the column bottom-left (#actions); over the 2D the dock goes back to its own corner, clear of the
// drawing's status.
const PHONE = matchMedia("(max-width: 760px)");
const actions = document.getElementById("actions"), photogenBtn = document.getElementById("photogen");
function placeActions() {
  const dock = document.getElementById("edit-ai-dock");
  if (PHONE.matches) actions.prepend(photogenBtn);
  else bar.querySelector(".row").append(photogenBtn);
  if (!dock) return;
  if (!PHONE.matches) photogenBtn.before(dock);
  else showing === "model" ? photogenBtn.after(dock) : document.body.append(dock);
}
placeActions();
TOUCH.addEventListener("change", showHelp);
PHONE.addEventListener("change", placeActions);

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  interact.update();
  move.render();
  if (showing !== "model") return;  // the drawing or the renders cover the scene; no need to keep rendering it
  if (mode === "walk" && !tween && !glide) {
    walkStep(dt);
    const r = flat.roomAt(camera.position.x, -camera.position.z);
    if (r && viewpoints.some(v => v.room === r.name)) showCaption(r.name);
  }
  if (orbitTop.enabled) {
    orbitTop.update();
    fitNear();
  }
  composer.render();
  labelRenderer.render(scene, camera);
  measure.render();
});

const loader = document.getElementById("loader");
loader.firstElementChild.innerHTML = [..."K&N Home"].map(c => {
  const ch = c === " " ? "\u00a0" : c === "&" ? "&amp;" : c;
  return `<span>${ch}</span>`;
}).join("");
gsap.timeline()
  .to("#loader span", { opacity: 1, y: 0, duration: 0.45, stagger: 0.07, ease: "power2.out", startAt: { y: 14 } })
  .to(loader, { opacity: 0, duration: 0.5, delay: 0.15, onComplete: () => loader.remove() });
if (params.has("view") || startRoom || cam) loader.remove();
if (["drawing", "renders"].includes(params.get("show"))) showScreen(params.get("show"));

addEventListener("resize", () => {
  camera.aspect = aspect();
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
