name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_YvC3ul69D4rX9mJCIMeRwaRk
      VERCEL_PROJECT_ID: prj_tTYksE82B3dp1N9mN7i42HYqWt1n
    steps:
      - uses: actions/checkout@v4
      - run: npx --yes vercel@latest deploy --prod --yes --token="${{ secrets.VERCEL_TOKEN }}"
