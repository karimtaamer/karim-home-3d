plumbing_notes:
  - "Supply (PPR, hot + cold) runs horizontally in the gypsum ceiling with access panels at joints, dropping in the wall only at each fixture; avoid burying pipes in the floor (Karim, 2 Nov 2026)."
  - "Drain falls, pipe sizes and stack connections are NOT in the Main model, and the Lotus TP sanitary plan (p.6) gives supply setting-out only: to be set by the plumbing engineer and confirmed on site."
  - "Recommended (TO CONFIRM): uPVC 110 for WCs, 50 for floor drains / shower / washer / kitchen sink, 40 for basins, 32 for the bidet mixer area; falls 1-2 % to the stack; PPR supply pressure-tested at 1.5 x working pressure (10-15 bar) before closing walls."
  - "Master shower: linear drain ~70 cm along the build-out (D602.2 S1); guest bath: floor drain near the door + bath waste with an access panel in the deck (D603.4 S3)."
  - "Lotus TP p.6 still shows a terrace basin which Karim removed; Main governs."
  - "Which fixtures the laundry Ariston 9.5 kW heater feeds (kitchen sink / guest bathroom) is TO CONFIRM; the master bathroom has its own 7.5 kW heater in the vanity."
  - "Water pump: separate setup (ground-floor pump to roof tank + booster after the tank); see the water-pump review sent separately."
  - "AC condensate: each wall split (living, master, dining, reception) needs a drain route; TO CONFIRM with the AC installer."
  - "WCs have a plain wall-mounted bidet mixer, no spray-gun hose (Karim, 24 Oct 2026)."

