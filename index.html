<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { PointerLockControls } from "three/addons/controls/PointerLockControls.js";
import { CSS2DRenderer, CSS2DObject } from "three/addons/renderers/CSS2DRenderer.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";
import gsap from "gsap";
import { makeMaterials } from "./materials.js";
import { furnish } from "./furnish.js";

// --- The flat, built from window.MODEL (all geometry comes from the DWG via build_geometry.py) ---

const PAPER = 0xf3eee5;
const INK = 0x2b2622;

// Floor finishes (keys used by tour.json "finishes") and the library material each one uses.
const FINISH = { wood: "oak", tile: "stone", decking: "deck" };
const DEFAULT_FINISH = { dry: "wood", wet: "tile", outdoor: "decking" };
const STONE_WALLS = /toilet|bath|wc|shower/i;  // rooms lined in stone to the ceiling (per renders)
const SKIRTING = 0.08;

// Plan (x, y) metres -> world (x, 0, -y); shapes are extruded upwards.
function shape(ring, holes = []) {
  const s = new THREE.Shape(ring.map(([x, y]) => new THREE.Vector2(x, y)));
  s.holes = holes.map(h => new THREE.Path(h.map(([x, y]) => new THREE.Vector2(x, y))));
  return s;
}

function flatMesh(ring, holes, material, y) {
  const g = new THREE.ShapeGeometry(shape(ring, holes));
  g.rotateX(-Math.PI / 2);
  const m = new THREE.Mesh(g, material);
  m.position.y = y;
  return m;
}

function pointInRing([x, y], ring) {
  let hit = false;
  for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
    const [xi, yi] = ring[i], [xj, yj] = ring[j];
    if ((yi > y) !== (yj > y) && x < ((xj - xi) * (y - yi)) / (yj - yi) + xi) hit = !hit;
  }
  return hit;
}

function ringCentroid(ring) {
  let a = 0, x = 0, y = 0;
  for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
    const f = ring[j][0] * ring[i][1] - ring[i][0] * ring[j][1];
    a += f; x += (ring[j][0] + ring[i][0]) * f; y += (ring[j][1] + ring[i][1]) * f;
  }
  return [x / (3 * a), y / (3 * a)];
}

function ringArea(ring) {
  let a = 0;
  for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) a += ring[j][0] * ring[i][1] - ring[i][0] * ring[j][1];
  return Math.abs(a) / 2;
}

function buildFlat(M, scene) {
  // Everything above the cut plane is clipped: 1.2 m reads as a floor plan, 1000 shows full walls.
  const cutPlane = new THREE.Plane(new THREE.Vector3(0, -1, 0), 1000);
  const clip = [cutPlane];
  const lib = makeMaterials(clip);
  const mat = {
    wall: lib.limewash,
    // The inside of a clipped wall, seen from above, is the solid ink of a drawn plan.
    wallCut: new THREE.MeshBasicMaterial({ color: INK, side: THREE.BackSide, clippingPlanes: clip, toneMapped: false }),
    glass: new THREE.MeshPhysicalMaterial({ color: 0xcfe2ea, transparent: true, opacity: 0.16, roughness: 0.05, clippingPlanes: clip }),
    frame: lib.blackSteel,
    // Ceilings face down only, so they vanish from above and close the room from inside.
    ceiling: new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0x58564f, roughness: 1, side: THREE.BackSide, clippingPlanes: clip }),
    paper: new THREE.MeshBasicMaterial({ color: PAPER, toneMapped: false }),
  };

  const solids = [];
  function prism(ring, holes, base, top, material = mat.wall) {
    const g = new THREE.ExtrudeGeometry(shape(ring, holes), { depth: top - base, bevelEnabled: false });
    g.rotateX(-Math.PI / 2);
    const face = new THREE.Mesh(g, material);
    face.position.y = base;
    face.castShadow = face.receiveShadow = material !== mat.glass;
    scene.add(face);
    if (material !== mat.glass) {
      const cut = new THREE.Mesh(g, mat.wallCut);
      cut.position.y = base;
      scene.add(cut);
      solids.push(face);
    }
    return face;
  }

  for (const w of M.walls) prism(w.outer, w.holes, 0, w.height, w.height < M.ceiling ? lib.render : mat.wall);
  for (const o of M.openings) {
    if (o.kind === "door") {
      prism(o.outer, [], M.doorHead, M.ceiling);
    } else if (o.kind === "slider") {
      prism(o.outer, [], M.sliderHead, M.ceiling);
      prism(o.outer, [], 0, M.sliderHead, mat.glass);
      frame(o.outer, 0, M.sliderHead, 2);
    } else {
      prism(o.outer, [], 0, M.sill);
      prism(o.outer, [], M.winHead, M.ceiling);
      prism(o.outer, [], M.sill, M.winHead, mat.glass);
      frame(o.outer, M.sill, M.winHead, 1);
    }
  }

  // Slim black frames round the glazing (as in the renders), in the middle of the wall.
  function frame(ring, z0, z1, panes) {
    const [a, b, c] = ring;
    const long = Math.hypot(b[0] - a[0], b[1] - a[1]) >= Math.hypot(c[0] - b[0], c[1] - b[1]);
    const [p, q] = long ? [a, b] : [b, c];
    const off = long ? [(c[0] - b[0]) / 2, (c[1] - b[1]) / 2] : [(a[0] - b[0]) / 2, (a[1] - b[1]) / 2];
    const L = Math.hypot(q[0] - p[0], q[1] - p[1]), ang = Math.atan2(q[1] - p[1], q[0] - p[0]);
    const at = t => [p[0] + off[0] + (q[0] - p[0]) * t, p[1] + off[1] + (q[1] - p[1]) * t];
    const bar = (t0, t1, h0, h1) => {
      const [x0, y0] = at(t0), [x1, y1] = at(t1);
      const m = new THREE.Mesh(new THREE.BoxGeometry(Math.max(0.04, Math.hypot(x1 - x0, y1 - y0)), h1 - h0, 0.05), mat.frame);
      m.position.set((x0 + x1) / 2, (h0 + h1) / 2, -(y0 + y1) / 2);
      m.rotation.y = ang;
      scene.add(m);
    };
    const e = 0.02 / L;
    bar(0, 1, z0, z0 + 0.05); bar(0, 1, z1 - 0.05, z1);
    for (let k = 0; k <= panes; k++) bar(k / panes - (k ? e : -e), k / panes - (k ? e : -e), z0, z1);
  }

  // Room linings from the DWG skins: stone to the ceiling in bathrooms, oak skirting elsewhere.
  for (const s of M.skins || []) {
    const stone = STONE_WALLS.test(s.room);
    const g = new THREE.ExtrudeGeometry(shape(s.outer, s.holes), { depth: stone ? M.ceiling - 0.002 : SKIRTING, bevelEnabled: false });
    g.rotateX(-Math.PI / 2);
    const m = new THREE.Mesh(g, stone ? lib.stoneWall : lib.oakVeneer);
    m.receiveShadow = true;
    scene.add(m);
  }

  // Rooms: a paper floor (the drawing) under a finished floor that fades in, plus the room's
  // share of the plan linework and a warm light, so each room can "come alive" on its own.
  const finishes = M.tour?.finishes || {};
  const rooms = {};
  const room = name => (rooms[name] ??= {
    name, kind: "dry", rings: [], area: 0, floors: [], ceilings: [],
    lineMat: new THREE.LineBasicMaterial({ color: INK, transparent: true, opacity: 1, toneMapped: false }),
    centre: new THREE.Vector3(), light: null, reveal: 0,
  });
  for (const f of M.floor) {
    const r = room(f.room);
    r.kind = f.kind;
    r.rings.push(f.outer);
    r.area += ringArea(f.outer) - f.holes.reduce((a, h) => a + ringArea(h), 0);
    const paper = flatMesh(f.outer, f.holes, mat.paper, 0);
    paper.receiveShadow = true;
    scene.add(paper);
    const fm = lib[FINISH[finishes[f.room] || DEFAULT_FINISH[f.kind]] || FINISH.wood].clone();
    fm.clippingPlanes = null;
    fm.transparent = true;
    fm.opacity = 0;
    const floorMesh = flatMesh(f.outer, f.holes, fm, 0.002);
    floorMesh.receiveShadow = true;
    scene.add(floorMesh);
    r.floors.push(floorMesh);
    if (f.kind !== "outdoor") {
      const c = flatMesh(f.outer, f.holes, mat.ceiling, M.ceiling);
      scene.add(c);
      r.ceilings.push(c);
    }
  }
  for (const r of Object.values(rooms)) {
    const [cx, cy] = ringCentroid(r.rings.reduce((a, b) => (ringArea(b) > ringArea(a) ? b : a)));
    r.centre.set(cx, 0, -cy);
    if (r.kind !== "outdoor") {
      r.light = new THREE.PointLight(0xffc68a, 0, 7, 1.4);
      r.light.position.set(cx, M.ceiling - 0.35, -cy);
      scene.add(r.light);
    }
  }
  const roomAt = (x, y) => Object.values(rooms).find(r => r.rings.some(ring => pointInRing([x, y], ring)));

  // Plan linework, grouped by the room it sits in (walls and windows stay as permanent ink).
  // Door swings are redrawn cleanly from the detected doors: a quarter arc and the open leaf.
  const lines = [...M.lines];
  const leaves = [];
  for (const s of M.swings || []) {
    const [hx, hy] = s.hinge;
    const a0 = Math.atan2(s.closed[1] - hy, s.closed[0] - hx);
    const sweep = [Math.PI / 2, -Math.PI / 2]
      .map(d => ({ d, end: [hx + Math.cos(a0 + d) * s.r, hy + Math.sin(a0 + d) * s.r] }))
      .find(o => roomAt(...o.end)) || { d: Math.PI / 2 };
    const arc = [];
    for (let k = 0; k <= 24; k++) arc.push([hx + Math.cos(a0 + (sweep.d * k) / 24) * s.r, hy + Math.sin(a0 + (sweep.d * k) / 24) * s.r]);
    lines.push({ kind: "door", pts: arc }, { kind: "door", pts: [[hx, hy], arc[arc.length - 1]] });
    // The leaf itself, standing open where the drawing swings it (the front door is shown shut).
    const front = M.tour?.start && Math.hypot(hx - M.tour.start[0], hy - M.tour.start[1]) < 2.2;
    const [ex, ey] = front ? s.closed : arc[arc.length - 1];
    const leaf = new THREE.Mesh(new THREE.BoxGeometry(s.r - 0.02, M.doorHead - 0.01, 0.04), lib.oakVeneer);
    leaf.position.set((hx + ex) / 2, (M.doorHead - 0.01) / 2, -(hy + ey) / 2);
    leaf.rotation.y = Math.atan2(ey - hy, ex - hx);
    leaf.castShadow = leaf.receiveShadow = true;
    scene.add(leaf);
    leaves.push(leaf);
  }
  const groups = new Map();
  const shared = new THREE.LineBasicMaterial({ color: INK, toneMapped: false });
  for (const l of lines) {
    const mid = l.pts[Math.floor(l.pts.length / 2)];
    const r = l.kind === "furniture" || l.kind === "door" ? roomAt(mid[0], mid[1]) : null;
    const key = r ? r.name : "";
    if (!groups.has(key)) groups.set(key, []);
    const arr = groups.get(key);
    for (let i = 1; i < l.pts.length; i++) {
      arr.push(l.pts[i - 1][0], 0.012, -l.pts[i - 1][1], l.pts[i][0], 0.012, -l.pts[i][1]);
    }
  }
  for (const [key, arr] of groups) {
    const g = new THREE.BufferGeometry();
    g.setAttribute("position", new THREE.Float32BufferAttribute(arr, 3));
    const lines = new THREE.LineSegments(g, key ? rooms[key].lineMat : shared);
    scene.add(lines);
  }

  function setReveal(r, t) {
    r.reveal = t;
    for (const f of r.floors) {
      f.material.opacity = t;
      f.material.transparent = t < 1;
    }
    r.lineMat.opacity = 1 - t;
    r.lineMat.visible = t < 0.999;
    if (r.light) r.light.intensity = 2 * t;
  }

  const furniture = furnish(scene, M, lib);
  return { cutPlane, solids, rooms, roomAt, setReveal, materials: mat, lib, furniture, leaves };
}


// --- Viewer ---------------------------------------------------------------------------------
const M = window.MODEL;
const EYE = 1.6;
const PLAN_CUT = 1.2;
const DOLL_CUT = 1.3;
const FULL = M.ceiling + 0.05;  // at or above this the walls are shown whole
const FOV = { top: 2.2, dollhouse: 40, walk: 70 };
const toWorld = ([x, y], h = 0) => new THREE.Vector3(x, h, -y);
const lerp = (a, b, t) => a + (b - a) * t;
const UP = new THREE.Vector3(0, 1, 0);
const NORTH_UP = new THREE.Vector3(0, 0, -1);  // plan drawn the right way up when looking down

const canvas = document.getElementById("scene");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.localClippingEnabled = true;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.85;
const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: "fixed", inset: 0, pointerEvents: "none", zIndex: 1 });
document.body.appendChild(labelRenderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(PAPER);
const camera = new THREE.PerspectiveCamera(FOV.dollhouse, innerWidth / innerHeight, 0.05, 4000);
const [W, D] = M.bounds;
const centre = new THREE.Vector3(W / 2, 0, -D / 2);

// Soft reflections from a neutral studio environment, a warm sky/bounce fill and a low
// golden-hour sun from the south-west (the renders' warm glow).
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.3;
scene.add(new THREE.HemisphereLight(0xfff4e6, 0xc9a77f, 0.8));
const sun = new THREE.DirectionalLight(0xffd29a, 2.0);
sun.position.set(centre.x - 14, 16, centre.z + 12);
sun.target.position.copy(centre);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
Object.assign(sun.shadow.camera, { left: -16, right: 16, top: 16, bottom: -16, near: 1, far: 70 });
sun.shadow.bias = -0.0004;
scene.add(sun, sun.target);

const flat = buildFlat(M, scene);
const paper = new THREE.Color(PAPER);
const sky = (() => {  // a soft evening sky for walking (seen through windows and on the terrace)
  const c = document.createElement("canvas");
  c.width = 4; c.height = 256;
  const g = c.getContext("2d"), grad = g.createLinearGradient(0, 0, 0, 256);
  grad.addColorStop(0, "#5f93cc"); grad.addColorStop(0.38, "#a9c8e4"); grad.addColorStop(0.49, "#f1dcc4"); grad.addColorStop(0.5, "#e9d2b4"); grad.addColorStop(1, "#cdb79c");
  g.fillStyle = grad; g.fillRect(0, 0, 4, 256);
  const t = new THREE.CanvasTexture(c);
  t.mapping = THREE.EquirectangularReflectionMapping;
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
})();
// Post-processing: a gentle bloom so LED strips, downlights and lamp shades glow like the renders.
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.4, 0.35, 1.5);
composer.addPass(bloom);
composer.addPass(new OutputPass());
const rooms = flat.rooms;
const viewpoints = M.tour.stops.map(s => ({ ...s, eye: toWorld(s.eye, EYE), look: toWorld(s.look, EYE - 0.15) }));

// --- Look of the flat: wall cut height, drawing vs finished rooms, ceilings ------------------
const look = { cut: FULL, finish: 1 };
let ceilingWanted = false;
function applyLook() {
  flat.cutPlane.constant = look.cut >= FULL ? 1000 : look.cut;
  flat.materials.wallCut.visible = look.cut < FULL;
  for (const r of Object.values(rooms)) flat.setReveal(r, look.finish);
  flat.furniture.setReveal(look.finish);
  flat.leaves.forEach(l => (l.visible = look.finish > 0.01));
  const ceilings = mode === "walk" || ceilingWanted;
  for (const r of Object.values(rooms)) r.ceilings.forEach(c => (c.visible = ceilings));
  flat.furniture.ceilingBits.visible = ceilings && look.finish > 0.01;
  scene.background = mode === "walk" ? sky : paper;
}

// --- Room labels (top + dollhouse) ------------------------------------------------------------
const planLabels = [];
for (const v of viewpoints) {
  const r = rooms[v.room];
  if (!r) continue;
  const el = document.createElement("div");
  el.className = "plan-label";
  el.textContent = v.caption;
  const obj = new CSS2DObject(el);
  obj.position.copy(r.centre).setY(0.05);
  scene.add(obj);
  planLabels.push(el);
}

// --- Camera poses and smooth transitions ------------------------------------------------------
const aspect = () => innerWidth / innerHeight;
const fitDist = fov => (Math.max(D / 2, W / 2 / aspect()) * 1.18) / Math.tan(THREE.MathUtils.degToRad(fov) / 2);
function topPose() {
  return { pos: centre.clone().setY(fitDist(FOV.top)), target: centre.clone(), fov: FOV.top, up: NORTH_UP.clone() };
}
function dollPose() {
  const pitch = THREE.MathUtils.degToRad(52), yaw = THREE.MathUtils.degToRad(-18);
  const dir = new THREE.Vector3(Math.cos(pitch) * Math.sin(yaw), Math.sin(pitch), Math.cos(pitch) * Math.cos(yaw));
  return { pos: centre.clone().addScaledVector(dir, fitDist(FOV.dollhouse) * 0.92), target: centre.clone(), fov: FOV.dollhouse, up: UP.clone() };
}
function currentPose() {
  const dir = new THREE.Vector3();
  camera.getWorldDirection(dir);
  const target = mode === "walk" ? camera.position.clone().add(dir) : (mode === "top" ? orbitTop : orbit).target.clone();
  return { pos: camera.position.clone(), target, fov: camera.fov, up: camera.up.clone() };
}
function setPose(p) {
  camera.position.copy(p.pos);
  camera.up.copy(p.up).normalize();
  camera.fov = p.fov;
  fitNear();
  camera.lookAt(p.target);
}
// Depth precision: the top view sits ~300 m up with a narrow lens; keep the near plane in step
// with the camera height or the linework 12 mm above the floor drowns in the floor.
function fitNear() {
  camera.near = camera.position.y > 5 ? camera.position.y * 0.3 : 0.05;
  camera.far = Math.max(200, camera.position.y * 4);
  camera.updateProjectionMatrix();
}
function blendPose(a, b, t) {
  // Field of view is blended in log space so a dolly from near-flat to perspective feels even.
  return {
    pos: a.pos.clone().lerp(b.pos, t),
    target: a.target.clone().lerp(b.target, t),
    fov: Math.exp(lerp(Math.log(a.fov), Math.log(b.fov), t)),
    up: a.up.clone().lerp(b.up, t).normalize(),
  };
}

let tween = null;
function animate(path, { duration = 1.6, cut, finish, onDone } = {}) {
  // path: list of poses to pass through; cut / finish: target look values.
  tween?.kill();
  orbit.enabled = orbitTop.enabled = false;
  const from = { cut: look.cut, finish: look.finish };
  const state = { t: 0 };
  const poses = [currentPose(), ...path];
  tween = gsap.to(state, {
    t: 1, duration, ease: "power2.inOut",
    onUpdate: () => {
      const n = poses.length - 1, k = Math.min(n - 1, Math.floor(state.t * n));
      setPose(blendPose(poses[k], poses[k + 1], state.t * n - k));
      if (cut !== undefined) look.cut = lerp(from.cut, cut, state.t);
      if (finish !== undefined) look.finish = lerp(from.finish, finish, state.t);
      applyLook();
    },
    onComplete: () => { tween = null; onDone?.(); },
  });
}

// --- Controls -----------------------------------------------------------------------------------
const orbit = new OrbitControls(camera, renderer.domElement);  // dollhouse (made with y up)
orbit.enableDamping = true;
orbit.maxPolarAngle = THREE.MathUtils.degToRad(86);
orbit.enabled = false;
camera.up.copy(NORTH_UP);
const orbitTop = new OrbitControls(camera, renderer.domElement);  // top (made with north up)
orbitTop.enableRotate = false;
orbitTop.enableDamping = true;
orbitTop.screenSpacePanning = true;
orbitTop.enabled = false;
camera.up.copy(UP);
const walker = new PointerLockControls(camera, document.body);

let mode = "dollhouse";
const help = document.getElementById("help");
const HELP = {
  dollhouse: "Drag to orbit · scroll to zoom · right-drag to pan",
  top: "Scroll to zoom · drag to pan",
  walk: "Click to look around · WASD / arrows to move · Shift to hurry · Esc to free the mouse",
};
function setMode(m) {
  mode = m;
  document.querySelectorAll("[data-view]").forEach(b => b.classList.toggle("on", b.dataset.view === m));
  help.textContent = HELP[m];
  labelRenderer.domElement.style.display = m === "walk" ? "none" : "";
  document.getElementById("shade").style.opacity = m === "walk" ? 1 : 0;
  if (m !== "walk" && walker.isLocked) walker.unlock();
}
const cutAway = () => document.getElementById("cut").classList.contains("on");

function goTop() {
  setMode("top");
  animate([topPose()], { duration: 1.8, cut: PLAN_CUT, finish: 0, onDone: () => { orbitTop.target.copy(centre); orbitTop.enabled = true; } });
}
function goDollhouse() {
  const from = mode;
  setMode("dollhouse");
  const path = from === "walk" ? [{ ...dollPose(), pos: camera.position.clone().setY(6) }, dollPose()] : [dollPose()];
  animate(path, { duration: from === "top" ? 2.2 : 1.8, cut: cutAway() ? DOLL_CUT : FULL, finish: 1, onDone: () => { orbit.target.copy(centre); orbit.enabled = true; } });
}
function goRoom(v) {
  if (mode === "walk") return walkTo(v);
  // From above: drop in over the room (no walls in the way), then settle at eye height.
  setMode("walk");
  const eyePose = { pos: v.eye.clone(), target: v.look.clone(), fov: FOV.walk, up: UP.clone() };
  const over = { pos: v.eye.clone().setY(7), target: v.eye.clone().lerp(v.look, 0.3).setY(0), fov: 55, up: UP.clone() };
  animate([over, eyePose], { duration: 2.4, cut: FULL, finish: 1, onDone: () => arrive(v) });
}

// --- Walking: free movement with wall collision, or a glide along the route to a room ---------
const keys = {};
addEventListener("keydown", e => { keys[e.code] = true; if (glide && /^(Key[WASD]|Arrow)/.test(e.code)) stopGlide(); });
addEventListener("keyup", e => { keys[e.code] = false; });
renderer.domElement.addEventListener("click", () => mode === "walk" && !tween && walker.lock());
const ray = new THREE.Raycaster();
const velocity = new THREE.Vector3();
function blocked(from, dir, dist) {
  for (const h of [0.35, 1.2]) {
    ray.set(new THREE.Vector3(from.x, h, from.z), dir);
    ray.far = dist + 0.3;
    if (ray.intersectObjects(flat.solids).length) return true;
  }
  return false;
}
function walkStep(dt) {
  const fwd = (keys.KeyW || keys.ArrowUp ? 1 : 0) - (keys.KeyS || keys.ArrowDown ? 1 : 0);
  const side = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0);
  const dir = new THREE.Vector3();
  camera.getWorldDirection(dir);
  dir.y = 0;
  dir.normalize();
  const right = new THREE.Vector3().crossVectors(dir, UP);
  const wish = dir.multiplyScalar(fwd).add(right.multiplyScalar(side));
  if (wish.lengthSq()) wish.normalize().multiplyScalar(keys.ShiftLeft || keys.ShiftRight ? 2.8 : 1.5);
  velocity.lerp(wish, 1 - Math.exp(-dt * 9));  // ease in and out of each step
  const speed = velocity.length();
  if (speed < 0.01) return;
  const step = velocity.clone().normalize();
  if (blocked(camera.position, step, speed * dt)) { velocity.set(0, 0, 0); return; }
  camera.position.addScaledVector(velocity, dt);
}

// Route-finding on the walkable grid exported from the DWG (doors included, walls kept clear of).
const nav = M.nav;
const free = (i, j) => j >= 0 && j < nav.rows.length && i >= 0 && i < nav.cols && nav.rows[j][i] === "1";
const toCell = ([x, y]) => [Math.round((x - nav.x0) / nav.cell), Math.round((y - nav.y0) / nav.cell)];
const toPlan = ([i, j]) => [nav.x0 + i * nav.cell, nav.y0 + j * nav.cell];
function nearestFree(c) {
  for (let r = 0; r < 12; r++)
    for (let di = -r; di <= r; di++)
      for (let dj = -r; dj <= r; dj++)
        if (free(c[0] + di, c[1] + dj)) return [c[0] + di, c[1] + dj];
  return c;
}
function clearLine(a, b) {
  const n = Math.ceil(Math.hypot(b[0] - a[0], b[1] - a[1]) * 2);
  for (let k = 0; k <= n; k++) if (!free(Math.round(lerp(a[0], b[0], k / n)), Math.round(lerp(a[1], b[1], k / n)))) return false;
  return true;
}
function route(fromPlan, toPlanPt) {
  const s = nearestFree(toCell(fromPlan)), g = nearestFree(toCell(toPlanPt));
  const key = c => c[0] + c[1] * nav.cols;
  const cost = new Map([[key(s), 0]]), came = new Map(), open = [[0, s]];
  while (open.length) {
    open.sort((a, b) => a[0] - b[0]);
    const [, c] = open.shift();
    if (c[0] === g[0] && c[1] === g[1]) break;
    for (let di = -1; di <= 1; di++) for (let dj = -1; dj <= 1; dj++) {
      if (!di && !dj) continue;
      const n = [c[0] + di, c[1] + dj];
      if (!free(...n)) continue;
      const nc = cost.get(key(c)) + Math.hypot(di, dj);
      if (nc < (cost.get(key(n)) ?? Infinity)) {
        cost.set(key(n), nc);
        came.set(key(n), c);
        open.push([nc + Math.hypot(g[0] - n[0], g[1] - n[1]), n]);
      }
    }
  }
  const cells = [g];
  while (came.has(key(cells[0]))) cells.unshift(came.get(key(cells[0])));
  // String-pull: keep only the corners needed to stay clear of walls.
  const pts = [cells[0]];
  let k = 0;
  while (k < cells.length - 1) {
    let far = k + 1;
    for (let m = cells.length - 1; m > k + 1; m--) if (clearLine(cells[k], cells[m])) { far = m; break; }
    pts.push(cells[far]);
    k = far;
  }
  return [fromPlan, ...pts.slice(1, -1).map(toPlan), toPlanPt];
}

let glide = null;
function stopGlide() { glide?.kill(); glide = null; }
function walkTo(v) {
  stopGlide();
  const here = [camera.position.x, -camera.position.z];
  const pts = route(here, [v.eye.x, -v.eye.z]).map(p => toWorld(p, EYE));
  if (pts.length === 2) pts.splice(1, 0, pts[0].clone().lerp(pts[1], 0.5));
  const curve = new THREE.CatmullRomCurve3(pts, false, "centripetal");
  const len = curve.getLength();
  const startDir = new THREE.Vector3();
  camera.getWorldDirection(startDir);
  const state = { u: 0 };
  glide = gsap.to(state, {
    u: 1, duration: Math.min(8, Math.max(1.2, len / 1.5)), ease: "power1.inOut",
    onUpdate: () => {
      const pos = curve.getPointAt(state.u);
      const ahead = curve.getPointAt(Math.min(1, state.u + 0.03)).sub(pos).setY(0);
      if (ahead.lengthSq() < 1e-6) ahead.copy(startDir).setY(0);
      ahead.normalize();
      const along = pos.clone().addScaledVector(ahead, 2.5);
      const start = pos.clone().addScaledVector(startDir.clone().setY(0).normalize(), 2.5);
      const target = start.lerp(along, Math.min(1, state.u * 6)).lerp(v.look, THREE.MathUtils.smoothstep(state.u, 0.6, 1));
      setPose({ pos, target, fov: FOV.walk, up: UP });
    },
    onComplete: () => { glide = null; arrive(v); },
  });
}

// --- Room captions: on arrival, and whenever you walk into another room ------------------------
const caption = document.getElementById("caption");
let captionRoom = null;
function showCaption(name) {
  if (!name || name === captionRoom) return;
  captionRoom = name;
  const v = viewpoints.find(x => x.room === name);
  const r = rooms[name];
  if (!v || !r) return;
  caption.querySelector(".name").textContent = v.caption;
  caption.querySelector(".meta").textContent = `${r.area.toFixed(1)} m²`;
  gsap.killTweensOf(caption);
  gsap.timeline()
    .fromTo(caption, { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" })
    .to(caption, { opacity: 0, duration: 0.8, delay: 2.6 });
}
function arrive(v) { captionRoom = null; showCaption(v.room); }

// --- UI -------------------------------------------------------------------------------------------
const roomBar = document.getElementById("rooms");
for (const v of viewpoints) {
  const b = document.createElement("button");
  b.textContent = v.caption;
  b.onclick = () => goRoom(v);
  roomBar.appendChild(b);
}
document.querySelectorAll("[data-view]").forEach(b => (b.onclick = () => {
  stopGlide();
  if (b.dataset.view === "top") goTop();
  else if (b.dataset.view === "dollhouse") goDollhouse();
  else goRoom(viewpoints[0]);
}));
document.getElementById("cut").onclick = e => {
  const on = !e.target.classList.contains("on");
  e.target.classList.toggle("on", on);
  e.target.textContent = `Walls: ${on ? "cut away" : "full height"}`;
  if (mode === "dollhouse") animate([], { duration: 0.9, cut: on ? DOLL_CUT : FULL });
};
document.getElementById("ceil").onclick = e => {
  ceilingWanted = !ceilingWanted;
  e.target.textContent = `Ceiling: ${ceilingWanted ? "on" : "off"}`;
  applyLook();
};

// --- Start: the drawing first, then the walls rise into the dollhouse ---------------------------
const params = new URLSearchParams(location.search);
const startRoom = params.get("room") && viewpoints.find(v => v.caption.toLowerCase().startsWith(params.get("room").toLowerCase()));
// ?cam=x,y,h,lookX,lookY,lookH[,fov] (plan metres): stand anywhere, e.g. to match a render's angle.
const cam = params.get("cam")?.split(",").map(Number);
if (params.has("clean")) document.querySelectorAll(".ui").forEach(e => (e.style.display = "none"));
if (cam?.length >= 6) {
  setMode("walk");
  look.cut = FULL; look.finish = 1; applyLook();
  setPose({ pos: toWorld(cam, cam[2]), target: toWorld(cam.slice(3), cam[5]), fov: cam[6] || FOV.walk, up: UP });
} else if (startRoom) {
  setMode("walk");
  look.cut = FULL; look.finish = 1; applyLook();
  setPose({ pos: startRoom.eye, target: startRoom.look, fov: FOV.walk, up: UP });
} else if (params.get("view") === "top") {
  setMode("top");
  look.cut = PLAN_CUT; look.finish = 0; applyLook();
  setPose(topPose());
  orbitTop.target.copy(centre); orbitTop.enabled = true;
} else {
  setMode("top");
  look.cut = PLAN_CUT; look.finish = 0; applyLook();
  setPose(topPose());
  if (params.get("view") === "dollhouse") {
    setMode("dollhouse");
    look.cut = cutAway() ? DOLL_CUT : FULL; look.finish = 1; applyLook();
    setPose(dollPose());
    orbit.target.copy(centre); orbit.enabled = true;
  } else {
    setTimeout(goDollhouse, 1400);
  }
}

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  if (mode === "walk" && !tween && !glide) {
    walkStep(dt);
    const r = flat.roomAt(camera.position.x, -camera.position.z);
    if (r && viewpoints.some(v => v.room === r.name)) showCaption(r.name);
  }
  if (orbit.enabled) orbit.update();
  if (orbitTop.enabled) orbitTop.update();
  if (orbit.enabled || orbitTop.enabled) fitNear();
  composer.render();
  labelRenderer.render(scene, camera);
});

const loader = document.getElementById("loader");
loader.firstElementChild.innerHTML = [..."LOTUS"].map(c => `<span>${c}</span>`).join("");
gsap.timeline()
  .to("#loader span", { opacity: 1, y: 0, duration: 0.45, stagger: 0.07, ease: "power2.out", startAt: { y: 14 } })
  .to(loader, { opacity: 0, duration: 0.5, delay: 0.15, onComplete: () => loader.remove() });
if (params.has("view") || startRoom || cam) loader.remove();

addEventListener("resize", () => {
  camera.aspect = aspect();
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
